<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة الأسطول — تصميم الويب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F8;--card:#fff;--line:#E2E6EA;--line2:#EEF1F4;--ink:#14202B;--ink2:#1F2A37;--muted:#4B5563;--pri:#0F5FA8;--pri2:#0B4A84;--priS:#E8F1FB;--ok:#05603A;--okS:#E7F5EE;--warn:#93370D;--warnS:#FEF0E1;--bad:#A01B12;--badS:#FDECEC;--vio:#5B2C83;--vioS:#F1E9F8;--side:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);font-size:14px}
a{color:var(--pri);text-decoration:none}a:hover{color:var(--pri2)}
h1{margin:0;font-size:24px}h2{margin:0;font-size:17px}h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--muted)}.small{font-size:12px}.b{font-weight:700}
header.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-inline-end:8px}
select,input,textarea{font:inherit;min-height:38px;padding:0 10px;border:1px solid #CBD2D9;border-radius:8px;background:#fff;color:var(--ink)}
textarea{padding:8px 10px;min-height:70px;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid #CBD2D9;background:#fff;color:var(--ink2);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F7F9FB}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{background:var(--pri2)}
.btn.d{color:var(--bad);border-color:#F0B7B2}
.btn.s{min-height:30px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.layout{display:flex;min-height:calc(100vh - 59px)}
nav.side{width:250px;flex:0 0 250px;background:var(--side);border-inline-end:1px solid var(--line);padding:12px 10px;position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto}
.ng{font-size:11px;font-weight:700;color:#6B7785;margin:14px 10px 4px;letter-spacing:.3px}
.nl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-size:14px}
.nl:hover{background:#EEF2F6;color:var(--ink2)}
.nl.on{background:var(--priS);color:var(--pri2);font-weight:600}
.nl .code{margin-inline-start:auto;font-size:10px;color:#8A96A3;font-weight:600}
main{flex:1;min-width:0;padding:22px 24px 80px;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card.np{padding:0;overflow:hidden}.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g6{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi .v{font-size:22px;font-weight:700;margin:4px 0 6px;white-space:nowrap}.kpi .chip{white-space:normal}.kpi .l{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#EEF1F4;color:#374151;white-space:nowrap}
.ok{background:var(--okS);color:var(--ok)}.warn{background:var(--warnS);color:var(--warn)}.bad{background:var(--badS);color:var(--bad)}.info{background:var(--priS);color:var(--pri2)}.vio{background:var(--vioS);color:var(--vio)}
.pj{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}.pj i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFC}
td{padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#F7FAFD}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:10px 14px;border:0;background:none;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--pri2);border-color:var(--pri)}
.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);border-radius:4px}
.rule{display:inline-block;font-size:11px;font-weight:700;color:var(--vio);background:var(--vioS);border-radius:4px;padding:1px 6px;margin-inline-start:4px}
.code{font-size:11px;font-weight:700;color:#6B7785;background:#EEF1F4;border-radius:4px;padding:2px 6px}
.note{border:1px dashed #B8C4D0;background:#FAFCFE;border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted)}
.banner{border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.banner.bad{border:1px solid #F0B7B2}.banner.warn{border:1px solid #F5C99B}.banner.info{border:1px solid #B9D3EE}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.step{display:flex;align-items:center;gap:6px;font-size:12px}.step .d{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;background:#E5E9ED;color:#4B5563}.step.done .d{background:var(--ok);color:#fff}.step.cur .d{background:var(--pri);color:#fff}.step+.step:before{content:"";width:18px;height:2px;background:#D5DBE1}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;font-size:14px}.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:500}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.kcol{background:#EEF2F6;border-radius:10px;padding:10px}.kcol h3{font-size:13px;display:flex;justify-content:space-between}.kc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.ph-img{background:repeating-linear-gradient(45deg,#E9EDF1,#E9EDF1 8px,#F2F5F7 8px,#F2F5F7 16px);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6B7785;font-size:12px;text-align:center}
.cal{display:grid;grid-template-columns:140px repeat(7,1fr);font-size:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal>div{padding:8px;border-bottom:1px solid var(--line2);border-inline-start:1px solid var(--line2);min-height:38px}
.cal .h{background:#FAFBFC;font-weight:600;color:var(--muted)}
.blk{display:block;border-radius:6px;padding:3px 6px;font-weight:600;font-size:11px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.ro-banner{display:none}
body.ro .act{display:none!important}body.ro .ro-banner{display:flex}
.modal{position:fixed;inset:0;background:rgba(20,32,43,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:50;overflow:auto}
.modal.on{display:flex}
.paper{background:#fff;width:min(780px,100%);border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:34px 40px;font-size:13px}
.paper table td,.paper table th{border:1px solid #9AA5B1;white-space:normal;background:#fff}
.paper .fh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #14202B;padding-bottom:10px;margin-bottom:14px}
.sig{border:1px solid #9AA5B1;border-radius:4px;padding:10px;min-height:80px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14202B;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--priS);color:var(--pri2);display:flex;align-items:center;justify-content:center;font-weight:700}
.sw{display:inline-block;width:34px;height:20px;border-radius:10px;background:var(--pri);position:relative;vertical-align:middle}.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:14px;height:14px;border-radius:50%;background:#fff}.sw.off{background:#CBD2D9}.sw.off:after{inset-inline-start:auto;inset-inline-end:3px}
.ck{color:var(--ok);font-weight:700}.x{color:#B0B8C1}
#mnav{display:none}
@media (max-width:900px){nav.side{display:none}#mnav{display:block;width:100%}main{padding:16px}.g2{grid-template-columns:1fr}header.top{padding:10px 16px}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0F5FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="7" width="15" height="10" rx="2"/><path d="M16 10h4l3 3v4h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="19" cy="18" r="2"/></svg>
    منصة الأسطول
  </div>
  <label class="muted small" style="display:flex;align-items:center;gap:6px">المشروع
    <select id="fProject" onchange="render()"><option value="">كل المشاريع</option><option>هواوي</option><option>ENI</option><option>B2B</option><option>B2C</option></select>
  </label>
  <label class="muted small" style="display:flex;align-items:center;gap:6px">الوكالة
    <select id="fAgency" onchange="render()"><option value="">صفاقس وتونس</option><option>صفاقس</option><option>تونس</option></select>
  </label>
  <div style="flex:1"></div>
  <label class="muted small" style="display:flex;align-items:center;gap:6px" title="لمعاينة ما يراه كل دور">عرض كـ
    <select id="fRole" onchange="setRole(this.value)"></select>
  </label>
  <select aria-label="اللغة" onchange="toast('اللغة تُحفظ لكل مستخدم. الفرنسية والإنجليزية بنفس الشاشات من اليسار لليمين.');this.value='ar'"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select>
  <a class="btn" href="#/notifications" aria-label="الإشعارات">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>12</span>
  </a>
  <div style="display:flex;align-items:center;gap:8px"><div class="avatar" id="uAv">و</div><div style="font-size:12px;line-height:1.3"><div class="b" id="uName">الوكيل</div><div class="muted" id="uRole">اطلاع كامل</div></div></div>
  <select id="mnav" aria-label="الشاشة" onchange="location.hash='#/'+this.value"></select>
</header>
<div class="layout">
  <nav class="side" id="nav" aria-label="القائمة الرئيسية"></nav>
  <main id="main"></main>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== البيانات التجريبية ===================== */
const PROJ = {"هواوي":"#C2410C","ENI":"#B7791F","B2B":"#0F5FA8","B2C":"#7C3AED"};
const ROLES = {
  gerant:{n:"الوكيل",d:"اطلاع كامل · اعتماد الصرف والشراء",av:"و"},
  auditor:{n:"المدقق / Group COO",d:"اطلاع كامل · بدون تعديل",av:"م",ro:true},
  cfo:{n:"Group CFO",d:"المالية والإجارة والربحية",av:"ف"},
  ops_hw:{n:"مسئول تشغيل هواوي",d:"مشروع هواوي",av:"هـ"},
  ops_b2b:{n:"مسئول تشغيل B2B/C",d:"ENI وB2B وB2C",av:"ب"},
  maint:{n:"مسئول الصيانة والوثائق",d:"كل السيارات",av:"ص"},
  hr:{n:"الموارد البشرية",d:"ملفات الأجراء",av:"ر"},
  finance:{n:"المالية",d:"أذون الصرف والتحصيل",av:"ل"},
  dispatcher:{n:"الديسباتشر",d:"المهام والمطابقة (إعداد فقط)",av:"د"}
};
const NAV = [
  {g:"الرئيسية",i:[["dashboard","لوحة التحكم","W-01"],["notifications","الإشعارات",""]]},
  {g:"الأسطول",i:[["vehicles","السيارات","W-02"],["documents","الوثائق والآجال","W-03"],["gps","GPS والمطابقة","W-04"],["maintenance","الصيانة والحوادث","W-06"],["checks","الفحوصات","M-03"],["fuel","الوقود","W-11"],["tolls","الكارتات","جديد"]]},
  {g:"العملاء والمشاريع",i:[["customers","العملاء","جديد"],["eni","طلبيات ENI","W-05"],["huawei","خدمة هواوي","W-09"],["rentals","الحجوزات والكراء","W-10"]]},
  {g:"الأفراد",i:[["drivers","السائقون والعهدة","W-13"],["hr","الموارد البشرية","W-14"]]},
  {g:"المالية والرقابة",i:[["finance","المالية","W-12"],["audit","التدقيق","W-07"],["settings","الإعدادات","W-08"]]}
];
const ALL = NAV.flatMap(g=>g.i.map(x=>x[0])).concat(["vehicle"]);
const ACCESS = {
  gerant:ALL, auditor:ALL,
  cfo:["dashboard","notifications","vehicles","vehicle","fuel","tolls","customers","eni","rentals","finance","audit"],
  ops_hw:["dashboard","notifications","vehicles","vehicle","gps","maintenance","checks","fuel","tolls","customers","huawei","drivers"],
  ops_b2b:["dashboard","notifications","vehicles","vehicle","maintenance","checks","fuel","tolls","customers","eni","rentals","drivers"],
  maint:["dashboard","notifications","vehicles","vehicle","documents","gps","maintenance","checks","fuel"],
  hr:["dashboard","notifications","drivers","hr"],
  finance:["dashboard","notifications","fuel","tolls","customers","eni","rentals","finance"],
  dispatcher:["dashboard","notifications","vehicles","vehicle","gps","huawei"]
};
const PRIO = {customers:"P1",dashboard:"P1",vehicles:"P1",vehicle:"P1",documents:"P1",gps:"P1",eni:"P1",maintenance:"P1",audit:"P1",settings:"P1",checks:"P1",huawei:"P2",rentals:"P2",fuel:"P2",finance:"P2",drivers:"P2",tolls:"P2",hr:"P3",notifications:"P1"};

const V = [
  {id:"v1",cu:"ENI Tunisia",p:"214 TU 5531",m:"Peugeot 301 · 2023",pr:"ENI",ag:"صفاقس",km:84210,st:"تعمل",own:"إجارة · البركة",dr:"سامي الجلاصي",fuel:7.4},
  {id:"v2",cu:"Huawei Tunisie",p:"198 TU 2207",m:"Renault Clio · 2022",pr:"هواوي",ag:"تونس",km:131560,st:"ممنوعة",why:"فحص فني منتهي",own:"إجارة · الزيتونة",dr:"وليد الحمامي",fuel:6.9},
  {id:"v3",cu:"Huawei Tunisie",p:"221 TU 9014",m:"Toyota Hilux · 2024",pr:"هواوي",ag:"صفاقس",km:46880,st:"تعمل",own:"ملك",dr:"أنيس بن سالم",fuel:9.8},
  {id:"v4",cu:"شركة الأمل للتوزيع",p:"176 TU 4418",m:"Dacia Logan · 2020",pr:"B2B",ag:"تونس",km:197420,st:"تعمل",own:"إجارة · البركة",dr:"هشام الطرابلسي",fuel:6.6,resale:true},
  {id:"v5",cu:"—",p:"205 TU 7765",m:"Hyundai Accent · 2022",pr:"B2C",ag:"تونس",km:92300,st:"صيانة",why:"تغيير فرامل",own:"ملك",dr:"—",fuel:6.8},
  {id:"v6",cu:"ENI Tunisia",p:"219 TU 3302",m:"Peugeot 301 · 2024",pr:"ENI",ag:"صفاقس",km:12040,st:"تعمل",own:"إجارة · الزيتونة",dr:"كريم الشابي",fuel:7.1},
  {id:"v7",cu:"حريف فرد (BK-1190)",p:"188 TU 6120",m:"Kia Picanto · 2021",pr:"B2C",ag:"صفاقس",km:118900,st:"مكتراة لحريف",own:"ملك",dr:"—",fuel:5.9},
  {id:"v8",cu:"Huawei Tunisie",p:"210 TU 0951",m:"Isuzu D-Max · 2023",pr:"هواوي",ag:"تونس",km:77615,st:"تعمل",own:"مكتراة من الغير",dr:"مراد العياري",fuel:10.4},
  {id:"v9",cu:"شركة النخيل للخدمات",p:"201 TU 8833",m:"Renault Symbol · 2022",pr:"B2B",ag:"صفاقس",km:103220,st:"تعمل",own:"إجارة · البركة",dr:"نبيل القاسمي",fuel:12.9},
  {id:"v10",cu:"Huawei Tunisie",p:"223 TU 1180",m:"Peugeot 208 · 2025",pr:"هواوي",ag:"صفاقس",km:8410,st:"دون GPS",own:"ملك",dr:"فارس المحجوب",fuel:null}
];
const DRV = [
  ["سامي الجلاصي","أجير","ENI","214 TU 5531","2028-03-12","تم","4.5 / 5"],
  ["وليد الحمامي","أجير","هواوي","198 TU 2207","2026-12-01","تم","3.8 / 5"],
  ["أنيس بن سالم","أجير","هواوي","221 TU 9014","2029-07-20","تم","4.2 / 5"],
  ["هشام الطرابلسي","مستقل","B2B","176 TU 4418","2027-05-04","—","—"],
  ["كريم الشابي","أجير","ENI","219 TU 3302","2030-01-15","بانتظار الإمضاء","—"],
  ["مراد العياري","أجير","هواوي","210 TU 0951","2026-11-29","تم","3.1 / 5"],
  ["نبيل القاسمي","مستقل","B2B","201 TU 8833","2027-09-30","—","—"],
  ["فارس المحجوب","أجير","هواوي","223 TU 1180","2031-02-11","تم","—"]
];

/* ===================== أدوات العرض ===================== */
const $=s=>document.querySelector(s);
const chip=(t,k="")=>`<span class="chip ${k}">${t}</span>`;
const pj=n=>`<span class="pj"><i style="background:${PROJ[n]||'#999'}"></i>${n}</span>`;
const rule=r=>`<span class="rule">${r}</span>`;
const money=n=>n.toLocaleString("en-US",{minimumFractionDigits:3,maximumFractionDigits:3})+" د.ت";
const km=n=>n.toLocaleString("en-US")+" كم";
const T=(cols,rows,cls="")=>`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>Array.isArray(r)?`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`:`<tr class="${r.cls||''}" onclick="${r.on||''}">${r.c.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const kpi=(l,v,sub="",color="")=>`<div class="card kpi"><div class="l">${l}</div><div class="v" style="${color?'color:'+color:''}">${v}</div>${sub}</div>`;
const card=(title,body,extra="",np=true)=>`<section class="card ${np?'np':''}"><div class="hd"><h2>${title}</h2><div>${extra}</div></div>${body}</section>`;
const btn=(t,cls="",on="")=>`<button class="btn act ${cls}" type="button" onclick="${on||`toast('تصميم: ${t}')`}">${t}</button>`;
const pbtn=(t,on)=>btn(t,"p",on);
const formBtn=(f)=>`<button class="btn s" type="button" onclick="showForm('${f}')">PDF ${f}</button>`;
const stChip=s=>({"تعمل":chip(s,"ok"),"ممنوعة":chip(s+" · R1","bad"),"صيانة":chip(s,"warn"),"مكتراة لحريف":chip(s,"info"),"دون GPS":chip(s,"warn")}[s]||chip(s));
const steps=(list,cur)=>`<div class="steps">${list.map((s,i)=>`<span class="step ${i<cur?'done':i===cur?'cur':''}"><span class="d">${i<cur?'✓':i+1}</span>${s}</span>`).join("")}</div>`;
const STATE={tab:{},role:"gerant"};
function tabs(route,list){const cur=STATE.tab[route]||list[0][0];return {cur,html:`<div class="tabs">${list.map(([k,t])=>`<button class="tab ${k===cur?'on':''}" onclick="STATE.tab['${route}']='${k}';render()">${t}</button>`).join("")}</div>`}}
function head(route,title,sub,acts=""){const code=(NAV.flatMap(g=>g.i).find(x=>x[0]===route)||[])[2]||"W-02";return `<div class="ph"><div><div style="display:flex;gap:6px;margin-bottom:6px">${code?`<span class="code">${code}</span>`:""}<span class="code">${PRIO[route]||""}</span></div><h1>${title}</h1>${sub?`<p class="muted" style="margin:4px 0 0">${sub}</p>`:""}</div><div class="acts">${acts}</div></div><div class="banner info ro-banner">👁 أنت في وضع <b>اطلاع فقط</b>: المدقق يرى كل البيانات وسجل التدقيق ولا يعدّل البيانات التشغيلية.</div>`}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600)}
function closeModal(){$("#modal").classList.remove("on")}
function vf(){const p=$("#fProject").value,a=$("#fAgency").value;return V.filter(v=>(!p||v.pr===p)&&(!a||v.ag===a))}

function setRole(r){STATE.role=r;const R=ROLES[r];$("#uName").textContent=R.n;$("#uRole").textContent=R.d;$("#uAv").textContent=R.av;document.body.classList.toggle("ro",!!R.ro);
 if(!ACCESS[r].includes(route().name))location.hash="#/dashboard";else render()}
function route(){const h=location.hash.replace(/^#\//,"").split("/");return{name:h[0]||"dashboard",arg:h[1]}}
function render(){const {name,arg}=route();const allowed=ACCESS[STATE.role];
 $("#nav").innerHTML=NAV.map(g=>{const items=g.i.filter(x=>allowed.includes(x[0]));if(!items.length)return"";return`<div class="ng">${g.g}</div>`+items.map(([k,n,c])=>`<a class="nl ${k===name||(name==="vehicle"&&k==="vehicles")?'on':''}" href="#/${k}">${n}<span class="code">${c}</span></a>`).join("")}).join("")+`<div class="note" style="margin:16px 4px 0;font-size:12px">نموذج تصميم · البيانات تجريبية · غيّر "عرض كـ" لترى ما يراه كل دور.</div>`;
 $("#mnav").innerHTML=NAV.map(g=>{const items=g.i.filter(x=>allowed.includes(x[0]));return items.length?`<optgroup label="${g.g}">${items.map(([k,n,c])=>`<option value="${k}" ${k===name||(name==="vehicle"&&k==="vehicles")?"selected":""}>${n}${c?" · "+c:""}</option>`).join("")}</optgroup>`:""}).join("");
 const page=allowed.includes(name)&&PAGES[name]?PAGES[name]:null;
 $("#main").innerHTML=page?page(arg):`<div class="card"><h2>لا صلاحية</h2><p class="muted">هذا الدور لا يرى هذه الشاشة.</p></div>`;
 window.scrollTo(0,0)}
$("#fRole").innerHTML=Object.entries(ROLES).map(([k,r])=>`<option value="${k}">${r.n}</option>`).join("");
window.addEventListener("hashchange",render);
render();
</script>
</body>
