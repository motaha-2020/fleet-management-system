name: Images
# Builds the api / worker / web images and pushes them to GHCR, tagged with the commit SHA.
# The staging server only pulls them (infra/staging/deploy.sh); it never builds.
on:
  push:
    branches: [main, "staging/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:main
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Smoke-check the image
        run: |
          IMG=ghcr.io/${{ github.repository }}/${{ matrix.target }}:${{ github.sha }}
          case "${{ matrix.target }}" in
            api)    docker run --rm --entrypoint node "$IMG" -e "require('fs').statSync('dist/main.js'); require('fs').statSync('node_modules/@fleet/db/dist/cli.js'); require('fs').statSync('node_modules/@fleet/db/migrations')" ;;
            worker) docker run --rm --entrypoint node "$IMG" -e "require('fs').statSync('dist/main.js')" ;;
            web)    docker run --rm --entrypoint node "$IMG" -e "require('fs').statSync('apps/web/server.js')" ;;
          esac
