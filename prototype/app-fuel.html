<script>

class DCLogic { constructor(props) { this.props = props || {}; this.state = {}; } setState(p) { Object.assign(this.state, p); __render(); } forceUpdate() { __render(); } }
function __get(path, scope) { return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope); }
function __esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
let __handlers = [];
function __tpl(t, scope) {
  t = t.replace(/<sc-for list="\{\{\s*([\w.$]+)\s*\}\}" as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g, (m, list, as, inner) =>
    (__get(list, scope) || []).map((item, i) => __tpl(inner, Object.assign({}, scope, { [as]: item, $index: i }))).join(''));
  t = t.replace(/<sc-if value="\{\{\s*([\w.$]+)\s*\}\}"[^>]*>([\s\S]*?)<\/sc-if>/g, (m, cond, inner) => (__get(cond, scope) ? __tpl(inner, scope) : ''));
  t = t.replace(/onClick="\{\{\s*([\w.$]+)\s*\}\}"/g, (m, p) => { __handlers.push(__get(p, scope)); return 'data-dc-click="' + (__handlers.length - 1) + '"'; });
  return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g, (m, p) => __esc(__get(p, scope)));
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fuel: 'petrol', tank: 'full', pay: 'cash' };

  renderVals() {
    const on = 'background: #FFFFFF; color: #0B4A84; box-shadow: 0 1px 2px rgba(20,32,43,0.15);';
    const off = 'background: transparent; color: #374151;';
    const s = this.state;
    const petrol = s.fuel === 'petrol';
    const cash = s.pay === 'cash';
    return {
      petrolOn: petrol ? 'true' : 'false', cngOn: petrol ? 'false' : 'true',
      petrolStyle: petrol ? on : off, cngStyle: petrol ? off : on,
      fullOn: s.tank === 'full' ? 'true' : 'false', partialOn: s.tank === 'full' ? 'false' : 'true',

      qtyLabel: petrol ? 'الكمية (لتر)' : 'الكمية (م³)',
      qtyValue: petrol ? '40' : '18',
      amount: petrol ? '760' : '153',

      receiptColor: cash ? '#93370D' : '#4B5563',
      pickPetrol: () => this.setState({ fuel: 'petrol' }),
      pickCng: () => this.setState({ fuel: 'cng' }),
      pickFull: () => this.setState({ tank: 'full' }),
      pickPartial: () => this.setState({ tank: 'partial' }),
      pickCash: () => this.setState({ pay: 'cash' }),
      pickCard: () => this.setState({ pay: 'card' })
    };
  }
}

class=\"lbl\">العداد (كم)<\/span><input class=\"input\" type=\"text\" inputmode=\"numeric\" value=\"88,460\"><\/label>\n      <label style=\"display: flex; flex-direction: column; gap: 6px;\"><span class=\"lbl\">{{qtyLabel}}<\/span><input class=\"input\" type=\"text\" inputmode=\"decimal\" value=\"{{qtyValue}}\"><\/label>\n    <\/div>\n    <label style=\"display: flex; flex-direction: column; gap: 6px;\"><span class=\"lbl\">المبلغ الإجمالي (ج.م)<\/span><input class=\"input\" type=\"text\" inputmode=\"decimal\" value=\"{{amount}}\"><\/label>\n    <div style=\"font-size: 13px; color: #05603A; background: #E7F5EE; border-radius: 10px; padding: 8px 12px;\">{{priceNote}}<\/div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n      <span class=\"lbl\">الخزان<\/span>\n      <div class=\"seg\" role=\"radiogroup\" aria-label=\"الخزان\">\n        <button class=\"segbtn\" type=\"button\" role=\"radio\" aria-checked=\"{{fullOn}}\" onClick=\"{{pickFull}}\" style=\"{{fullStyle}}\">فوّلت للآخر<\/button>\n        <button class=\"segbtn\" type=\"button\" role=\"radio\" aria-checked=\"{{partialOn}}\" onClick=\"{{pickPartial}}\" style=\"{{partialStyle}}\">جزئي<\/button>\n      <\/div>\n    <\/div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n      <span class=\"lbl\">الدفع<\/span>\n      <div class=\"seg\" role=\"radiogroup\" aria-label=\"طريقة الدفع\">\n        <button class=\"segbtn\" type=\"button\" role=\"radio\" aria-checked=\"{{cashOn}}\" onClick=\"{{pickCash}}\" style=\"{{cashStyle}}\">كاش<\/button>\n        <button class=\"segbtn\" type=\"button\" role=\"radio\" aria-checked=\"{{cardOn}}\" onClick=\"{{pickCard}}\" style=\"{{cardStyle}}\">كارت وقود<\/button>\n      <\/div>\n    <\/div>\n\n    <button type=\"button\" style=\"display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 14px; border: 1px dashed #93B8E0; border-radius: 12px; background: #FFFFFF; color: #0B4A84; font: inherit; cursor: pointer; text-align: start;\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"><\/path><circle cx=\"12\" cy=\"13\" r=\"4\"><\/circle><\/svg>\n      <span style=\"display: flex; flex-direction: column; font-size: 15px; font-weight: 600;\">صوّر الإيصال<span style=\"font-size: 12px; font-weight: 500; color: {{receiptColor}};\">{{receiptNote}}<\/span><\/span>\n    <\/button>\n  <\/form>\n\n  <div style=\"padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E2E6EA; display: flex; flex-direction: column; gap: 8px;\">\n    <a class=\"primary\" href=\"app-sync.html\">حفظ<\/a>\n    <span style=\"font-size: 12px; color: #4B5563; text-align: center;\">هتتحفظ على الموبايل وتتبعت أول ما النت يرجع<\/span>\n  <\/div>\n<\/div>\n";
const __c = new Component({});
function __render() {
  __handlers = [];
  const root = document.getElementById('dc-root');
  root.innerHTML = __tpl(__TPL, __c.renderVals());
  root.querySelectorAll('[data-dc-click]').forEach((el) => el.addEventListener('click', (e) => { e.preventDefault(); const f = __handlers[+el.dataset.dcClick]; if (f) f(e); }));

</script>
