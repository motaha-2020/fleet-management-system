<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>بلاغ عطل — منصة الأسطول (نموذج)</title>

<style>
body{margin:0}
a{color:#0F5FA8}a:hover{color:#0B4A84}
.lbl{font-size:13px;font-weight:600;color:#1F2A37}
.input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid #CBD2D9;border-radius:12px;background:#FFFFFF;color:#14202B;box-sizing:border-box;width:100%}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #CBD2D9;background:#FFFFFF;font:inherit;font-size:14px;font-weight:600;color:#374151;cursor:pointer}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:72px;border-radius:12px;border:1px solid #CBD2D9;background:#FFFFFF;font:inherit;font-size:15px;font-weight:700;cursor:pointer}

</style>
<style>body{background:#D5DCE3 !important;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 12px;min-height:100vh;box-sizing:border-box}.phone{border-radius:40px;overflow:hidden;box-shadow:0 0 0 10px #1B232C,0 20px 50px rgba(20,32,43,.35);max-width:100%}</style>
</head>
<body>
<a href="index.html" style="font:600 14px system-ui;color:#0B4A84;background:#FFFFFF;padding:10px 16px;border-radius:999px;text-decoration:none">كل الشاشات</a>
<div class="phone"><div id="dc-root"></div></div>
<script>

class DCLogic { constructor(props) { this.props = props || {}; this.state = {}; } setState(p) { Object.assign(this.state, p); __render(); } forceUpdate() { __render(); } }

  t = t.replace(/<sc-for list="\{\{\s*([\w.$]+)\s*\}\}" as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g, (m, list, as, inner) =>

  t = t.replace(/<sc-if value="\{\{\s*([\w.$]+)\s*\}\}"[^>]*>([\s\S]*?)<\/sc-if>/g, (m, cond, inner) => (__get(cond, scope) ? __tpl(inner, scope) : ''));

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { level: 'medium', drivable: true };
  }
  renderVals() {
    const lv = this.state.level;
    const defs = [
      { id: 'low', label: 'بسيطة', on: 'background: #E8F1FB; border-color: #0F5FA8; color: #0B4A84;' },
      { id: 'medium', label: 'متوسطة', on: 'background: #FEF0E1; border-color: #C4580F; color: #93370D;' },
      { id: 'high', label: 'خطيرة', on: 'background: #FDECEC; border-color: #A01B12; color: #A01B12;' }
    ];
    const levels = defs.map((d) => ({
      label: d.label,
      checked: lv === d.id ? 'true' : 'false',
      style: lv === d.id ? d.on : '',
      pick: () => this.setState({ level: d.id })
    }));
    const d = this.state.drivable;
    return {
      levels,
      notDrivable: !d,
      yesStyle: d ? 'border: 2px solid #0F5FA8; color: #0B4A84; background: #E8F1FB;' : 'color: #374151;',
      noStyle: d ? 'color: #374151;' : 'border: 2px solid #A01B12; color: #A01B12; background: #FDECEC;',
      pickYes: () => this.setState({ drivable: true }),
      pickNo: () => this.setState({ drivable: false })
    };
  }
}

      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;\">\n        <button class=\"big\" type=\"button\" onClick=\"{{pickYes}}\" style=\"{{yesStyle}}\">أيوه، تنفع<\/button>\n        <button class=\"big\" type=\"button\" onClick=\"{{pickNo}}\" style=\"{{noStyle}}\">لا، متمشيش<\/button>\n      <\/div>\n      <sc-if value=\"{{notDrivable}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size: 13px; line-height: 1.5; color: #A01B12; background: #FDECEC; border-radius: 10px; padding: 10px 12px;\">المركبة هتتقفل عن التشغيل لحد ما الصيانة تخلص، ومدير الأسطول هيتبلغ فورًا.<\/div>\n      <\/sc-if>\n    <\/div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n      <span class=\"lbl\">صور (اختياري)<\/span>\n      <div style=\"display: flex; gap: 10px;\">\n        <div style=\"width: 84px; height: 84px; border-radius: 12px; background: #D9DFE5; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #374151;\">صورة 1<\/div>\n        <button type=\"button\" aria-label=\"إضافة صورة\" style=\"width: 84px; height: 84px; border-radius: 12px; border: 1px dashed #93B8E0; background: #FFFFFF; color: #0B4A84; display: flex; align-items: center; justify-content: center; cursor: pointer;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>\n        <\/button>\n      <\/div>\n    <\/div>\n  <\/form>\n\n  <div style=\"padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E2E6EA; display: flex; flex-direction: column; gap: 8px;\">\n    <a class=\"primary\" href=\"app-sync.html\">إرسال البلاغ<\/a>\n    <span style=\"font-size: 12px; color: #4B5563; text-align: center;\">يشتغل من غير نت — هيتبعت أول ما الاتصال يرجع<\/span>\n  <\/div>\n<\/div>\n";

</script>

</html>
